<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Basic SEO -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>
    LynqIQ | Software Development, Cybersecurity, AI & Data Solutions
  </title>

  <meta
    name="description"
    content="LynqIQ provides enterprise software development, cybersecurity solutions, AI systems, and data analytics services that help businesses innovate, scale, and grow securely."
  />

  <meta
    name="keywords"
    content="software development Kenya, cybersecurity solutions, AI development, data analytics, enterprise technology solutions, web development, machine learning, digital transformation"
  />

  <meta name="author" content="LynqIQ" />
  <meta name="robots" content="index, follow" />

  <!-- Canonical URL -->
  <link
    rel="canonical"
    href="https://lynqiq.vercel.app/"
  />

  <!-- Open Graph (Facebook, LinkedIn, WhatsApp) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="LynqIQ | Enterprise Technology Solutions" />
  <meta
    property="og:description"
    content="Software development, AI systems, cybersecurity, and data-driven innovation for modern businesses."
  />
  <meta property="og:url" content="https://lynqiq.vercel.app/" />
  <meta property="og:site_name" content="LynqIQ" />
  <meta property="og:image" content="https://lynqiq.vercel.app/og-image.jpg" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="LynqIQ | Enterprise Technology Solutions" />
  <meta
    name="twitter:description"
    content="Helping businesses grow through software engineering, AI, cybersecurity, and analytics."
  />
  <meta name="twitter:image" content="https://lynqiq.vercel.app/og-image.jpg" />

  <!-- Favicon -->
  <link rel="icon" href="/favicon.ico" />

  <!-- Performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=DM+Serif+Display:ital@0;1&display=swap"
    rel="stylesheet"
  />

  <!-- Structured Data (Schema Markup) -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "LynqIQ",
    "url": "https://lynqiq.vercel.app",
    "logo": "https://lynqiq.vercel.app/logo.png",
    "description": "Enterprise software development, cybersecurity, AI systems, and data analytics solutions.",
    "sameAs": [
      "https://linkedin.com/company/lynqiq",
      "https://twitter.com/lynqiq"
    ]
  }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
